<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký - WebShop</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-header"></header>
<form class="auth-form" onsubmit="doRegister(event)">
  <h2>Tạo tài khoản</h2>
  <input id="username" placeholder="Tên đăng nhập (>=3 ký tự)" required>
  <input id="password" type="password" placeholder="Mật khẩu (>=6 ký tự)" required>
  <button class="btn" style="width:100%" type="submit">Đăng ký</button>
  <p class="muted">Đã có tài khoản? <a href="/login.html">Đăng nhập</a></p>
</form>
<script src="/js/api.js"></script>
<script>
renderHeader();
async function doRegister(e) {
  e.preventDefault();
  try {
    const { token, user } = await API.post('/api/auth/register', {
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value
    });
    API.saveSession(token, user);
    toast('Tạo tài khoản thành công!');
    location.href = '/index.html';
  } catch (e) {
    toast(e.message);
  }
}
</script>
</body>
</html>
