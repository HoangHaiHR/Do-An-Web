<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebShop - Cửa hàng trực tuyến</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-header"></header>
<div class="container">
  <h2>Sản phẩm</h2>
  <div id="products" class="grid">Đang tải...</div>

  <h2 id="cart-title" style="display:none">Giỏ hàng</h2>
  <div id="cart" class="card" style="display:none"></div>
</div>

<script src="/js/api.js"></script>
<script>
renderHeader('shop');

let cart = JSON.parse(sessionStorage.getItem('cart') || '{}'); // {product_id: qty}

function saveCart() {
  sessionStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

async function loadProducts() {
  try {
    const { products } = await API.get('/api/products');
    const el = document.getElementById('products');
    if (products.length === 0) { el.innerHTML = '<p class="muted">Chưa có sản phẩm nào.</p>'; return; }
    el.innerHTML = products.map(p => `
      <div class="card product-card">
        <img src="${p.image_url || 'https://placehold.co/300x200?text=' + encodeURIComponent(p.name)}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p class="muted">${p.description || ''}</p>
        <p class="price">${money(p.price)}</p>
        <p class="muted">Còn ${p.stock} sản phẩm</p>
        <div class="qty-box">
          <input type="number" min="1" max="${p.stock}" value="1" id="qty-${p.id}">
          <button class="btn" ${p.stock === 0 ? 'disabled' : ''} onclick="addToCart(${p.id}, '${p.name.replace(/'/g, "\\'")}', ${p.price}, ${p.stock})">Thêm vào giỏ</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    toast(e.message);
  }
}

function addToCart(id, name, price, stock) {
  if (!API.token()) { location.href = '/login.html'; return; }
  const qtyInput = document.getElementById('qty-' + id);
  const qty = Math.max(1, Math.min(stock, parseInt(qtyInput.value, 10) || 1));
  cart[id] = { qty, name, price };
  saveCart();
  toast('Đã thêm vào giỏ hàng.');
}

function removeFromCart(id) {
  delete cart[id];
  saveCart();
}

function renderCart() {
  const ids = Object.keys(cart);
  const cartEl = document.getElementById('cart');
  const titleEl = document.getElementById('cart-title');
  if (ids.length === 0) { cartEl.style.display = 'none'; titleEl.style.display = 'none'; return; }
  cartEl.style.display = 'block';
  titleEl.style.display = 'block';
  let total = 0;
  const rows = ids.map(id => {
    const item = cart[id];
    total += item.qty * item.price;
    return `<tr>
      <td>${item.name}</td>
      <td>${item.qty}</td>
      <td>${money(item.price)}</td>
      <td>${money(item.qty * item.price)}</td>
      <td><button class="btn danger" onclick="removeFromCart(${id})">Xoá</button></td>
    </tr>`;
  }).join('');
  cartEl.innerHTML = `
    <table>
      <thead><tr><th>Sản phẩm</th><th>SL</th><th>Đơn giá</th><th>Thành tiền</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p style="text-align:right;font-weight:700;margin-top:10px">Tổng cộng: ${money(total)}</p>
    <div style="text-align:right"><button class="btn success" onclick="checkout()">Đặt hàng</button></div>
  `;
}

async function checkout() {
  const items = Object.entries(cart).map(([product_id, v]) => ({
    product_id: Number(product_id), quantity: v.qty
  }));
  try {
    await API.post('/api/orders', { items });
    toast('Đặt hàng thành công!');
    cart = {};
    saveCart();
    const me = await API.get('/api/auth/me');
    API.saveSession(API.token(), me.user);
    renderHeader();
    loadProducts();
  } catch (e) {
    toast(e.message);
  }
}

loadProducts();
renderCart();
</script>
</body>
</html>
