<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đơn hàng của tôi - WebShop</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-header"></header>
<div class="container">
  <h2>Đơn hàng của tôi</h2>
  <div id="orders">Đang tải...</div>
</div>
<script src="/js/api.js"></script>
<script>
API.requireLogin();
renderHeader();

async function load() {
  const { orders } = await API.get('/api/orders/me');
  const el = document.getElementById('orders');
  if (orders.length === 0) { el.innerHTML = '<p class="muted">Bạn chưa có đơn hàng nào.</p>'; return; }
  el.innerHTML = orders.map(o => `
    <div class="card" style="margin-bottom:12px">
      <p><b>Đơn #${o.id}</b> · ${new Date(o.created_at + 'Z').toLocaleString('vi-VN')} · Tổng: <span class="price">${money(o.total)}</span></p>
      <table>
        <thead><tr><th>Sản phẩm</th><th>SL</th><th>Đơn giá</th></tr></thead>
        <tbody>
          ${o.items.map(it => `<tr><td>${it.product_name}</td><td>${it.quantity}</td><td>${money(it.price)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `).join('');
}
load();
</script>
</body>
</html>
