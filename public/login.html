<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - WebShop</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-header"></header>
<form class="auth-form" onsubmit="doLogin(event)">
  <h2>Đăng nhập</h2>
  <input id="username" placeholder="Tên đăng nhập" required>
  <input id="password" type="password" placeholder="Mật khẩu" required>
  <button class="btn" style="width:100%" type="submit">Đăng nhập</button>
  <p class="muted">Chưa có tài khoản? <a href="/register.html">Đăng ký</a></p>
</form>
<script src="/js/api.js"></script>
<script>
renderHeader();
async function doLogin(e) {
  e.preventDefault();
  try {
    const { token, user } = await API.post('/api/auth/login', {
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value
    });
    API.saveSession(token, user);
    location.href = user.role === 'admin' ? '/admin.html' : '/index.html';
  } catch (e) {
    toast(e.message);
  }
}
</script>
</body>
</html>
